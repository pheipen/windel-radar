name: Preise holen
on:
  schedule:
    # 06:23/12:23/18:23 Zürich im Sommer (Winter 1 h früher); odd minute because GitHub delays/drops runs at :00
    - cron: "23 4,10,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Selbsttest
        run: python scraper/test_parse.py && python scraper/test_aktionis.py
      - name: Preise holen
        run: python scraper/run.py
      - name: Speichern
        run: |
          git config user.name "windel-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Preise $(TZ=Europe/Zurich date '+%Y-%m-%d %H:%M')"
          git push
